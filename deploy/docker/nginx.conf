worker_processes 1;
events { worker_connections 1024; }
http {
    server_tokens off;
    access_log off;
    error_log /dev/stderr warn;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    set_real_ip_from 172.23.0.0/16;
    real_ip_header CF-Connecting-IP;
    map $uri $search_key {
        default "";
        "~^/(?:[a-z]{2}(?:-[A-Za-z]{2})?/)?(?:browse|kind|category|topic|for|api/v1/artifacts)(?:/|$)" $binary_remote_addr;
    }
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
    limit_req_zone $search_key zone=search:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=connections:5m;
    # Anonymous documents and public catalog JSON, keyed by full URL.
    #
    # The catalog's costly reads are admitted at about two per second, far below
    # what a crawl sends, so requests that miss must be refused rather than
    # queued: a queue in front of a one-core database only grows. The cache is
    # what keeps that refusal away from readers:
    #   - proxy_cache_lock coalesces concurrent misses on one URL into a single
    #     upstream request (a per-key queue, bounded by the lock timeout);
    #   - background_update uses bounded stale-while-revalidate/stale-if-error
    #     windows supplied by the app. Do not enable unconditional use_stale
    #     flags: a busy expired object could otherwise survive a later 404 forever.
    # `inactive` is idle eviction, not a maximum age for actively read objects.
    #
    # proxy_cache_min_uses is deliberately left at 1. Requiring a second request
    # before storing was measured to make things worse: a popular page's first
    # admitted response is the scarce one, and discarding it meant spending a
    # second admission on the same URL. Crawler entries are not the threat it
    # was meant to be — at ~140 KB each, 256 MB holds ~1,800 pages, more than
    # the ten-minute working set; over-bound unions are 404s and never stored.
    proxy_cache_path /var/cache/nginx/pages levels=1:2 keys_zone=pages:16m max_size=256m inactive=10m use_temp_path=off;
    map $http_cookie$http_authorization $private_request { default 1; "" 0; }
    map $http_accept $representation { default html; "~*text/markdown" markdown; }
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream application { zone application 64k; server app:3000 resolve; keepalive 16; }
    server {
        listen 8080;
        # The app reports why it refused a catalog query for its own request log.
        proxy_hide_header X-Catalog-Admission;
        # Bound same-key cache waiters; no unbounded origin request backlog.
        proxy_cache_lock_timeout 5s;
        proxy_cache_lock_age 5s;
        limit_req_status 429;
        limit_conn_status 429;
        limit_req zone=per_ip burst=20 nodelay;
        limit_req zone=search burst=10 nodelay;
        limit_conn connections 16;
        # Public catalog JSON has no personalized fields; credentials always bypass.
        location = /api/v1/artifacts {
            proxy_pass http://application;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host dsh.fish;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header CF-Connecting-IP $remote_addr;
            proxy_cache pages;
            proxy_cache_key "$request_method|$host|$request_uri|json";
            proxy_cache_valid 200 15s;
            proxy_cache_bypass $private_request;
            proxy_no_cache $private_request;
            proxy_cache_lock on;
            # Bounded stale windows come from upstream Cache-Control, not
            # directive flags (which would allow indefinitely stale content).
            proxy_cache_use_stale off;
            proxy_cache_background_update on;
            add_header X-Origin-Cache $upstream_cache_status always;
            proxy_read_timeout 90s;
        }
        location ^~ /api/ {
            proxy_pass http://application;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host dsh.fish;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header CF-Connecting-IP $remote_addr;
            proxy_buffering off;
            proxy_read_timeout 90s;
        }
        location / {
            proxy_pass http://application;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host dsh.fish;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header CF-Connecting-IP $remote_addr;
            proxy_cache pages;
            proxy_cache_key "$request_method|$host|$request_uri|$representation";
            proxy_cache_bypass $private_request;
            proxy_no_cache $private_request;
            proxy_cache_lock on;
            # Bounded stale windows come from upstream Cache-Control, not
            # directive flags (which would allow indefinitely stale content).
            proxy_cache_use_stale off;
            proxy_cache_background_update on;
            add_header X-Origin-Cache $upstream_cache_status always;
            proxy_buffering on;
            # Explicitly stream APIs, which never enter the document cache.
            proxy_ignore_client_abort off;
            proxy_read_timeout 90s;
            proxy_send_timeout 30s;
        }
    }
}
