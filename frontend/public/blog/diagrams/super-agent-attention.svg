<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="sa-title sa-desc">
  <title id="sa-title">Each layer of dsh-superagent sees only what needs its decision</title>
  <desc id="sa-desc">Messages from GitHub and Feishu pass a deterministic gate. Triggers on a Thread a ticket already subscribes to go straight to that Worker; the rest reach one Router session as batched candidates. The Router accepts work with a Mandate the host enforces, Workers report back, and the person receives a single short reply.</desc>
  <defs>
    <marker id="sa-arrow" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#68636f"/>
    </marker>
    <marker id="sa-arrow-accent" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7867d9"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#faf9fc"/>
  <text x="56" y="52" fill="#17151d" font-family="IBM Plex Sans, ui-sans-serif, system-ui" font-size="24" font-weight="700">Each layer sees only what needs its decision</text>
  <text x="56" y="78" fill="#68636f" font-family="IBM Plex Sans, ui-sans-serif, system-ui" font-size="12">dsh-superagent: a deterministic gate, one batching Router, Workers reached by Thread subscription.</text>

  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui">
    <!-- Connectors -->
    <path d="M 216,215 H 256" fill="none" stroke="#68636f" stroke-width="1.2" marker-end="url(#sa-arrow)"/>
    <path d="M 422,200 H 472" fill="none" stroke="#68636f" stroke-width="1.2" marker-end="url(#sa-arrow)"/>
    <path d="M 342,260 V 355 H 472" fill="none" stroke="#7867d9" stroke-width="1.6" marker-end="url(#sa-arrow-accent)"/>
    <path d="M 342,355 V 445 H 472" fill="none" stroke="#7867d9" stroke-width="1.6" marker-end="url(#sa-arrow-accent)"/>
    <path d="M 552,230 V 314" fill="none" stroke="#68636f" stroke-width="1.2" marker-end="url(#sa-arrow)"/>
    <path d="M 640,320 V 236" fill="none" stroke="#68636f" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#sa-arrow)"/>
    <path d="M 698,175 H 738" fill="none" stroke="#7867d9" stroke-width="1.6" marker-end="url(#sa-arrow-accent)"/>
    <path d="M 824,120 V 100 H 136 V 164" fill="none" stroke="#68636f" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#sa-arrow)"/>
    <path d="M 678,350 H 711 V 444 H 678 M 711,397 H 744" fill="none" stroke="#68636f" stroke-width="1.2" stroke-dasharray="2 3"/>

    <!-- Connector labels -->
    <text x="480" y="96" fill="#68636f" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" text-anchor="middle">the person writes on GitHub or Feishu</text>
    <text x="447" y="192" fill="#68636f" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" text-anchor="middle">batch</text>
    <text x="352" y="306" fill="#7867d9" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" font-weight="500">subscribed Thread:</text>
    <text x="352" y="320" fill="#7867d9" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" font-weight="500">straight to its Worker</text>
    <text x="546" y="276" fill="#68636f" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" text-anchor="end">accept</text>
    <text x="546" y="290" fill="#68636f" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" text-anchor="end">+ Mandate</text>
    <text x="648" y="282" fill="#68636f" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10">report</text>

    <!-- Sources -->
    <rect x="56" y="164" width="160" height="104" rx="6" fill="#ffffff" stroke="#d8d4df" stroke-width="1"/>
    <text x="74" y="194" fill="#17151d" font-size="16" font-weight="700">Sources</text>
    <text x="74" y="220" fill="#68636f" font-size="12">GitHub · Feishu</text>
    <text x="74" y="246" fill="#68636f" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10">high noise, low hit rate</text>

    <!-- Gate -->
    <rect x="262" y="164" width="160" height="96" rx="6" fill="#ffffff" stroke="#d8d4df" stroke-width="1"/>
    <text x="280" y="194" fill="#17151d" font-size="16" font-weight="700">Gate</text>
    <text x="280" y="218" fill="#68636f" font-size="12">deterministic code</text>
    <text x="280" y="242" fill="#68636f" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10">allowed list · bots</text>

    <!-- Router -->
    <rect x="478" y="120" width="220" height="110" rx="6" fill="#17151d" stroke="#7867d9" stroke-width="1.2"/>
    <text x="498" y="150" fill="#ffffff" font-size="16" font-weight="700">Router · main Session</text>
    <text x="498" y="176" fill="#d7d2df" font-size="12">routes, never executes</text>
    <text x="498" y="196" fill="#d7d2df" font-size="12">one call, many decisions</text>
    <text x="498" y="218" fill="#a99dea" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10">notes ≤ 30 words</text>

    <!-- Person -->
    <rect x="744" y="120" width="160" height="110" rx="6" fill="#eeeafd" stroke="#7867d9" stroke-width="1.6"/>
    <text x="762" y="150" fill="#17151d" font-size="16" font-weight="700">Person</text>
    <text x="762" y="176" fill="#68636f" font-size="12">one reply, ≤ 100 words</text>
    <text x="762" y="196" fill="#68636f" font-size="12">panel lists only</text>
    <text x="762" y="218" fill="#7867d9" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10">person / …</text>

    <!-- Workers -->
    <rect x="478" y="320" width="200" height="60" rx="6" fill="#ffffff" stroke="#d8d4df" stroke-width="1"/>
    <text x="496" y="346" fill="#17151d" font-size="14" font-weight="700">Worker · ticket A</text>
    <text x="496" y="366" fill="#68636f" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10">cards ≤ 600 chars + pointer</text>
    <rect x="478" y="414" width="200" height="60" rx="6" fill="#ffffff" stroke="#d8d4df" stroke-width="1"/>
    <text x="496" y="440" fill="#17151d" font-size="14" font-weight="700">Worker · ticket B</text>
    <text x="496" y="460" fill="#68636f" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10">shell to background after 5 s</text>

    <!-- Mandate -->
    <rect x="744" y="320" width="160" height="154" rx="6" fill="#ffffff" stroke="#d8d4df" stroke-width="1"/>
    <text x="762" y="348" fill="#17151d" font-size="14" font-weight="700">Mandate</text>
    <text x="762" y="370" fill="#68636f" font-size="12">enforced by the host</text>
    <text x="762" y="396" fill="#68636f" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10">policy version · scope</text>
    <text x="762" y="412" fill="#68636f" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10">strength · rules</text>
    <text x="762" y="440" fill="#68636f" font-size="12">outside text cannot</text>
    <text x="762" y="458" fill="#68636f" font-size="12">change it</text>
  </g>

  <text x="56" y="516" fill="#68636f" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10">Ablation without pass-through: same completion time, +30% Router decisions, +37% cache-read tokens.</text>
</svg>
