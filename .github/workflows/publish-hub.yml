name: Publish hub plugin

on:
  workflow_dispatch:
  push:
    tags:
      - 'hub-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm ≥ 11.5.1. Do not use npm@latest:
      # npm 12 requires Node ≥ 22.22.2, while this repo pins 22.22.0.
      - name: Use npm 11
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test plugin
        run: pnpm --filter @dsh-fish/hub run test

      - name: Build plugin
        run: pnpm --filter @dsh-fish/hub run build

      - name: Publish
        run: pnpm --filter @dsh-fish/hub publish --access public --no-git-checks --provenance --report-summary
